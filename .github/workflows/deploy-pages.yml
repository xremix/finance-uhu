name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Inject public legal contact details
        run: node scripts/inject-legal-contact.mjs
        env:
          LEGAL_NAME: ${{ secrets.LEGAL_NAME }}
          LEGAL_STREET: ${{ secrets.LEGAL_STREET }}
          LEGAL_POSTAL_CODE: ${{ secrets.LEGAL_POSTAL_CODE }}
          LEGAL_CITY: ${{ secrets.LEGAL_CITY }}
          LEGAL_COUNTRY: ${{ secrets.LEGAL_COUNTRY }}
          LEGAL_EMAIL: ${{ secrets.LEGAL_EMAIL }}
      - run: npx ng build --configuration production --base-href /finance-uhu/
      # SPA fallback so deep links / reloads don't 404
      - run: cp dist/finance-uhu/index.html dist/finance-uhu/404.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/finance-uhu

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
