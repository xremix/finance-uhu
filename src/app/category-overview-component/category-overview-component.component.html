@for (categorySummary of categorySummaries | orderBy: 'total'; track trackByCategoryId($index, categorySummary)) {
  <div>
    @if (categorySummary.total != 0) {
      <app-category-component [amountMonths]="amountMonths" [showAverage]="dataState.showAverage" [categorySummary]="categorySummary"></app-category-component>
    }
  </div>
}
