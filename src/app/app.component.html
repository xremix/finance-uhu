<div class="loading-overlay" *ngIf="dataState.isLoading" role="status" aria-live="polite">
  <div class="loading-card">
    <app-owl-loader [size]="64"></app-owl-loader>
    <div>
      <div class="loading-title">{{ dataState.loadingMessage || 'Daten werden geladen…' }}</div>
      <div class="loading-hint">Buchungen werden eingelesen und kategorisiert</div>
    </div>
  </div>
</div>

<a class="skip-link" href="#main-content" (click)="skipToMain($event)">Zum Inhalt springen</a>

<!-- Toolbar -->
<header class="toolbar sticky-top" *ngIf="showToolbar">
 <a href="./" class="brand-link">
  <app-owl-loader class="brand-logo" [size]="null" [loop]="false"></app-owl-loader>
  <span class="brand-name">Finanz <span class="brand-accent">Uhu</span></span>
 </a>
  <div class="spacer"></div>

  <nav class="toolbar-actions me-4" aria-label="Hauptnavigation">
    <app-file-selector [big]="false"></app-file-selector>
    <button type="button" (click)="openSettings()" class="top-nav-btn" title="Einstellungen öffnen" aria-label="Einstellungen öffnen">
      <i class="fa-solid fa-gear" aria-hidden="true"></i>
      <span>Einstellungen</span>
    </button>
  </nav>
</header>

<main id="main-content" tabindex="-1" class="container" style="margin-top: 30px;">
  <div>
    <router-outlet></router-outlet>
  </div>
  <!-- Footer -->
  <footer>
    <div class="d-flex flex-wrap justify-content-between gap-2 text-muted small">
      <span>© 2026 {{legalContact.name}}</span>
      <nav class="d-flex gap-3" aria-label="Weiterführende Links">
        <a routerLink="/impressum">Impressum</a>
        <a routerLink="/datenschutz">Datenschutz</a>
        <a routerLink="/settings">Einstellungen</a>
      </nav>
    </div>
  </footer>

  <svg id="clouds" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="2611.084" height="485.677" viewBox="0 0 2611.084 485.677">
